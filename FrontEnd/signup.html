<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Dining Guide</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body class="auth-page">

<div class="glass-card auth-card animate-fade">
    <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 2rem;">🍽 Dining Guide</a>
    <h2>Join the Journey</h2>
    
    <form onsubmit="validateSignup(event)">
        <div class="form-group">
            <label for="signup-name">Full Name</label>
            <input type="text" id="signup-name" placeholder="John Doe" required>
        </div>

        <div class="form-group">
            <label for="signup-email">Email Address</label>
            <input type="email" id="signup-email" placeholder="name@example.com" required>
        </div>
        
        <div class="row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label for="signup-confirm">Confirm</label>
                <input type="password" id="signup-confirm" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn" style="width: 100%; justify-content: center; margin-top: 1rem;">
            Create Account
        </button>

        <p id="signup-error" style="text-align: center; font-size: 0.9rem;"></p>
    </form>

    <p style="text-align: center; margin-top: 2rem; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign in</a>
    </p>
</div>

</body>
</html>
