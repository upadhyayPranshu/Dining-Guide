<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<div class="container">
    <div class="card form-card">
        <h2>Create Account</h2>

        <form onsubmit="validateSignup(event)">
            <label>Name</label>
            <input type="text" id="signup-name" placeholder="Your full name">

            <label>Email</label>
            <input type="email" id="signup-email" placeholder="you@example.com">

            <label>Password</label>
            <input type="password" id="signup-password" placeholder="Create password">

            <label>Confirm Password</label>
            <input type="password" id="signup-confirm" placeholder="Repeat password">

            <br><br>
            <button type="submit">Signup</button>
        </form>

        <!-- ERROR MESSAGE -->
        <div id="signup-error"></div>

        <p><br>Already registered? <a href="login.html">Login</a></p>
    </div>
</div>

</body>
</html>
