<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nutrition Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<header>
    <div class="container">
        <nav>
            <h1>🥗 Nutrition Tracker</h1>
            <div>
                <a href="restaurants.html">Restaurants</a>
                <a href="favorites.html">Favorites</a>
                <button onclick="logout()" class="btn btn-sm">Logout</button>
            </div>
        </nav>
    </div>
</header>

<div class="container">

    <!-- DATE SELECTOR -->
    <section class="date-section">
        <button class="btn btn-outline" onclick="changeDate(-1)">← Prev</button>
        <h2 id="currentDate"></h2>
        <button class="btn btn-outline" onclick="changeDate(1)">Next →</button>
    </section>

    <!-- DAILY SUMMARY -->
    <section class="nutrition-summary">
        <div class="card summary-card">
            <div class="summary-icon">🔥</div>
            <h3 id="totalCalories">0</h3>
            <p>Calories</p>
        </div>
        <div class="card summary-card">
            <div class="summary-icon">🥩</div>
            <h3 id="totalProtein">0g</h3>
            <p>Protein</p>
        </div>
        <div class="card summary-card">
            <div class="summary-icon">🍞</div>
            <h3 id="totalCarbs">0g</h3>
            <p>Carbs</p>
        </div>
        <div class="card summary-card">
            <div class="summary-icon">🧈</div>
            <h3 id="totalFats">0g</h3>
            <p>Fats</p>
        </div>
    </section>

    <!-- PROGRESS BARS -->
    <section class="card">
        <h2>Daily Progress</h2>
        <div class="progress-container">
            <div class="progress-item">
                <span>Calories (2000 goal)</span>
                <div class="progress-bar">
                    <div class="progress-fill" id="caloriesProgress"></div>
                </div>
                <span id="caloriesPercent">0%</span>
            </div>
            <div class="progress-item">
                <span>Protein (50g goal)</span>
                <div class="progress-bar">
                    <div class="progress-fill protein" id="proteinProgress"></div>
                </div>
                <span id="proteinPercent">0%</span>
            </div>
            <div class="progress-item">
                <span>Carbs (250g goal)</span>
                <div class="progress-bar">
                    <div class="progress-fill carbs" id="carbsProgress"></div>
                </div>
                <span id="carbsPercent">0%</span>
            </div>
            <div class="progress-item">
                <span>Fats (65g goal)</span>
                <div class="progress-bar">
                    <div class="progress-fill fats" id="fatsProgress"></div>
                </div>
                <span id="fatsPercent">0%</span>
            </div>
        </div>
    </section>

    <!-- LOG MEAL FORM -->
    <section class="card">
        <h2>Log a Meal</h2>
        <form id="mealForm" onsubmit="logMeal(event)">
            <div class="form-grid">
                <div>
                    <label>Meal Type</label>
                    <select id="mealType" required>
                        <option value="Breakfast">🌅 Breakfast</option>
                        <option value="Lunch">☀️ Lunch</option>
                        <option value="Dinner">🌙 Dinner</option>
                        <option value="Snack">🍿 Snack</option>
                    </select>
                </div>
                <div>
                    <label>Food Name</label>
                    <input type="text" id="foodName" placeholder="e.g., Grilled Chicken" required>
                </div>
            </div>
            <div class="form-grid nutrition-inputs">
                <div>
                    <label>Calories</label>
                    <input type="number" id="inputCalories" placeholder="0" min="0" required>
                </div>
                <div>
                    <label>Protein (g)</label>
                    <input type="number" id="inputProtein" placeholder="0" min="0" required>
                </div>
                <div>
                    <label>Carbs (g)</label>
                    <input type="number" id="inputCarbs" placeholder="0" min="0" required>
                </div>
                <div>
                    <label>Fats (g)</label>
                    <input type="number" id="inputFats" placeholder="0" min="0" required>
                </div>
            </div>
            <br>
            <button type="submit">+ Add Meal</button>
        </form>
    </section>

    <!-- MEALS LIST BY TYPE -->
    <section>
        <h2>Today's Meals</h2>
        
        <div class="meal-section">
            <h3>🌅 Breakfast</h3>
            <div id="breakfastList" class="meals-list"></div>
        </div>

        <div class="meal-section">
            <h3>☀️ Lunch</h3>
            <div id="lunchList" class="meals-list"></div>
        </div>

        <div class="meal-section">
            <h3>🌙 Dinner</h3>
            <div id="dinnerList" class="meals-list"></div>
        </div>

        <div class="meal-section">
            <h3>🍿 Snacks</h3>
            <div id="snackList" class="meals-list"></div>
        </div>
    </section>

</div>

<footer>© 2025 Dining Guide</footer>

</body>
</html>
