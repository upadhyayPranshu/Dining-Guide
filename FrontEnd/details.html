<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Restaurant Details</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<header>
    <div class="container">
        <nav>
            <h1 id="restaurantName">Loading...</h1>
            <div>
                <button id="favoriteBtn" class="btn btn-outline" onclick="toggleFavorite()">
                    <span id="favoriteIcon">♡</span> Favorite
                </button>
                <a href="restaurants.html">Back</a>
            </div>
        </nav>
    </div>
</header>

<div class="container">

    <!-- Restaurant Info -->
    <div class="grid">
        <div class="card">
            <h2>Restaurant Info</h2>
            <p><strong>Cuisine:</strong> <span id="restaurantCuisine">-</span></p>
            <p><strong>Rating:</strong> <span id="restaurantRating">-</span></p>
            <p><strong>Hours:</strong> 10 AM – 10 PM</p>
            <p><strong>Address:</strong> <span id="restaurantAddress">-</span></p>
        </div>

        <div class="card">
            <h2>Average Rating</h2>
            <div class="rating-display">
                <span class="big-rating" id="avgRating">0</span>
                <span class="rating-stars" id="avgStars">☆☆☆☆☆</span>
            </div>
            <p id="reviewCount">0 reviews</p>
        </div>
    </div>

    <!-- Menu Section -->
    <section class="card">
        <h2>📋 Menu</h2>
        <div id="menuList" class="menu-grid">
            <!-- Menu items loaded here -->
        </div>
        <div id="noMenu" style="display: none;">
            <p>No menu items available yet</p>
        </div>
    </section>

    <!-- Add Review Section -->
    <section class="card">
        <h2>✍️ Write a Review</h2>
        <form id="reviewForm" onsubmit="submitReview(event)">
            <label>Your Rating</label>
            <div class="star-rating" id="starRating">
                <span onclick="setRating(1)">☆</span>
                <span onclick="setRating(2)">☆</span>
                <span onclick="setRating(3)">☆</span>
                <span onclick="setRating(4)">☆</span>
                <span onclick="setRating(5)">☆</span>
            </div>
            <input type="hidden" id="ratingValue" value="0">
            <br>
            <label>Your Comment</label>
            <textarea id="reviewComment" rows="3" placeholder="Share your experience..."></textarea>
            <br><br>
            <button type="submit">Submit Review</button>
            <div id="reviewError"></div>
        </form>
    </section>

    <!-- Reviews List -->
    <section class="card">
        <h2>💬 Reviews</h2>
        <div id="reviewsList">
            <!-- Reviews loaded here -->
        </div>
        <div id="noReviews" style="display: none;">
            <p>No reviews yet. Be the first to review!</p>
        </div>
    </section>

</div>

<footer>© 2025 Dining Guide</footer>

</body>
</html>
